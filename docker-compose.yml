services:
  api:
    build: .
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --http h11
    ports: ["8000:8000"]
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/blockmla
      - WANDB_API_KEY=${WANDB_API_KEY}
      - WORKER_TOKEN_SECRET=${WORKER_TOKEN_SECRET:-default_secret_for_local_testing}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blockmla
    volumes:
      - pg_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  redis_data:
  pg_data:
  grafana_data:
